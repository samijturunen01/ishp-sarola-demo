<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Hades Design concept demo: keep out of search engines until the customer approves production. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>Itä-Suomen Huoltopalvelu Sarola – koneistus, TIG-hitsaus ja huollot Joensuussa</title>
    <meta
      name="description"
      content="CNC-koneistus, TIG-hitsaus, kiillotus sekä Abloy-avainjyrsinkoneiden ja Teknos-sävytyskoneiden huollot Joensuun Käpykankaalla vuodesta 2011."
    />
    <script>
      // Runs before first paint: enables progressive reveals and holds the
      // homepage hero for the nameplate intro (never on reduced motion).
      ;(function () {
        try {
          var d = document.documentElement
          d.classList.add('js')
          var base = '%BASE_URL%'
          var p = location.pathname
          var home = p === base || p + '/' === base || p === base + 'index.html'
          var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
          if (rm) d.classList.add('no-motion')
          else if (home) d.classList.add('intro-pending')
          // Failsafe: if the app never boots, show all content.
          setTimeout(function () {
            if (!window.__sarolaReady) {
              d.classList.add('no-motion')
              d.classList.remove('intro-pending')
            }
          }, 4000)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
